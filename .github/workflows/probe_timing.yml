name: probe timing
on: { push: { paths: [".github/workflows/probe_timing.yml"] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json,urllib.request
          H={"User-Agent":"Mozilla/5.0 Chrome/131","Referer":"https://player.georacing.com/"}
          get=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20))
          out=[]
          for e in get("https://player.georacing.com/datas/applications/app_46.json").get("events",[]):
            if "2026" not in e.get("name","") or "Qualif" in e.get("name",""): continue
            for x in get(f"https://player.georacing.com/datas/{e['id']}/races.json"):
              try: a=get(f"https://player.georacing.com/datas/{e['id']}/{x['id']}/all.json")
              except Exception as ex: out.append({"ev":e["name"],"race":x.get("name"),"err":str(ex)});continue
              r=a.get("race") or {}
              sp=[{"name":s.get("name"),"role":s.get("role"),"n":len(s.get("splittimes") or []),"times":sorted([t.get("time") for t in s.get("splittimes") or [] if t.get("time")])[:2]+sorted([t.get("time") for t in s.get("splittimes") or [] if t.get("time")])[-1:]} for s in a.get("splittimes") or []]
              out.append({"ev":e["name"],"evid":e["id"],"rid":x["id"],"race":x.get("name"),"start_time":r.get("start_time"),"end_time":r.get("end_time"),"available_time":r.get("available_time"),"real_start":r.get("real_start_time") or r.get("start_real"),"race_keys":sorted(r.keys()),"splits":sp})
          json.dump(out,open("timing_probe.json","w"),indent=1)
          PY
          git init -q && git checkout -q -b probe-timing && git add . && git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-timing
