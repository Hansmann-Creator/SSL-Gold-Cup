name: Georacing probe (temporary) 2
on:
  push:
    paths: [".github/workflows/geoprobe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe/geo.py
      - run: |
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          mv out /tmp/out; git checkout -q --orphan geo-probe; git rm -rqf . ; cp -r /tmp/out/* .
          git add -A; git commit -qm "geo probe"; git push -qf origin geo-probe
