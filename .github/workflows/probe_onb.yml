name: probe onb docs
on: { push: { paths: [".github/workflows/probe_onb.yml"] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          B=https://onb.sslgoldcup.com/finals2026/images/onbdocs
          for f in RIO-DETAIL_MAP_-_EN.png NOR_SSL_Gold_Cup_Finals_2026_as_amended_6_November_2026.pdf SI_SSL_Gold_Cup_Finals_2_November_2026.pdf SSL_Gold_Cup_Final_Series_Schedule_26_November_2026.pdf; do curl -sSfL -A "Mozilla/5.0" -o "$f" "$B/$f" || echo "fail $f"; done
          ls -la
          git init -q && git checkout -q -b probe-onb && git add . && git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-onb
