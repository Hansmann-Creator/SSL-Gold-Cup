name: Sailor profiles + individual rankings (manual run; daily.yml runs it every night)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: profiles, cancel-in-progress: false }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sailors.py all 100
      - run: |
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          git add profiles.json sp rank/ind.json
          if ! git diff --cached --quiet; then git commit -qm "sailor profiles + individual rankings"; git pull -q --rebase origin main; git push -q origin main && gh workflow run deploy.yml --ref main; fi
