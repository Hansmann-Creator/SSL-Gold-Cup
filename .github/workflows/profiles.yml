name: Sailor profiles (facts from the SSL site)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * 11,12 1"   # Mondays during the event
permissions:
  contents: write
  actions: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/profiles.py
      - run: |
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          git add profiles.json
          if ! git diff --cached --quiet; then git commit -qm "sailor profiles"; git pull -q --rebase origin main; git push -q origin main && gh workflow run deploy.yml --ref main; fi
