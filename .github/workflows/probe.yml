name: Temporary probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0" https://worldofsailors.com/sailor/robert-scheidt > a.html
          python3 - <<'PY'
          import re,html
          s=open('a.html',encoding='utf-8',errors='ignore').read()
          s=re.sub(r'<script.*?</script>|<style.*?</style>|<svg.*?</svg>','',s,flags=re.S)
          t=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>','|',s)))
          t=re.sub(r'(\s*\|\s*)+','|',t)
          for k in ['World Champion','Olympic Gold','Bio','Olympic Games|','World Championship|','Continental']:
              i=t.find(k); print('##',k,i, t[max(0,i-300):i+700] if i>=0 else '')
          PY
          grep -o '"__NEXT_DATA__"[^>]*>' a.html | head -2; grep -c "self.__next_f" a.html
