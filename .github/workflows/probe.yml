name: Temporary probe
on: workflow_dispatch
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          mkdir g && cd g
          H=(-A "Mozilla/5.0 Chrome/131" -e "https://player.georacing.com/")
          B=https://player.georacing.com/datas/102233/103496
          curl -s "${H[@]}" "https://player.georacing.com/js/script.js?v=20261029123804" -o script.js
          curl -s "${H[@]}" "https://player.georacing.com/?event=102233&race=103496&application_id=46" -o player.html
          for f in all.json stats.json positions/2026_11_15__r.json positions/2026_11_15__r0__positions.bin positions/2026_11_15__r1__positions.bin positions/OneBigFile__r__positions.bin; do curl -s "${H[@]}" "$B/$f" -o "$(echo $f | tr / _)"; done
          # an upcoming Rio race too (1/16 finals)
          curl -s "${H[@]}" https://player.georacing.com/datas/102235/races.json -o r16_races.json
          RID=$(python3 -c "import json;print([x['id'] for x in json.load(open('r16_races.json')) if x['name'].startswith('Race 1 - Group A')][0])")
          curl -s "${H[@]}" https://player.georacing.com/datas/102235/$RID/all.json -o r16_all.json
          ls -la
          git init -q && git checkout -q -b geo && git add -A && git -c user.name=x -c user.email=x@x commit -qm geo
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" geo
