name: Probe tracking (temporary)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=https://player.georacing.com/datas
          curl -sL "$D/102234/races.json" -o r.json
          python3 -c "
          import json;r=json.load(open('r.json'));print(len(r));x=r[0];print(sorted(x.keys()));print({k:x.get(k) for k in ['name','player_name','url_player','start_time','end_time','short_name']})
          print([y['name'] for y in r])"
          curl -sL "$D/102235/races.json" | head -c 400; echo
          curl -sL "https://app.georacing.com/protect_js/app/env.js?v=2" | head -c 1500; echo
          curl -sL "https://api.open-meteo.com/v1/forecast?latitude=-22.92&longitude=-43.17&hourly=wind_speed_10m&wind_speed_unit=kn&timezone=America%2FSao_Paulo&forecast_days=1" -D - -o /dev/null | grep -i "access-control\|HTTP/"
