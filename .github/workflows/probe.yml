name: Temporary probe (ranking)
on:
  push:
    paths: [".github/workflows/probe.yml",".github/probe_rank.py"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/probe_rank.py
      - run: |
          cd o && git init -q -b rankprobe && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rankprobe
