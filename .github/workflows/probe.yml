name: Temporary probe
on: workflow_dispatch
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          pip install playwright -q && python -m playwright install --with-deps chromium >/dev/null 2>&1
          (python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 2; mkdir shots
          python3 scripts/shot_trk.py 103528
          curl -sI -H "Origin: https://hansmann-creator.github.io" https://data-live.georacing.com/datas/102233/103496/live.json | head -20
          cd shots && git init -q && git checkout -q -b shots && git add -A && git -c user.name=x -c user.email=x@x commit -qm s && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots
