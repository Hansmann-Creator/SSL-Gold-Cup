name: Temporary probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36" -H "Accept-Language: en-US" -b "CONSENT=YES+1; SOCS=CAI" https://www.youtube.com/channel/UCslTs2hZG7d08VYH_mLGSUg/streams > s.html; wc -c s.html
          for k in ytInitialData videoRenderer lockupViewModel upcomingEventData '"UPCOMING"' '"LIVE"' isLiveNow; do printf "%s %s\n" "$k" "$(grep -o "$k" s.html | wc -l)"; done
          python3 - <<'PY'
          import re,json
          s=open('s.html',encoding='utf-8').read()
          m=re.search(r"var ytInitialData = (\{.*?\});</script>",s,re.S); print("m",bool(m))
          ids=re.findall(r'"contentId":"([\w-]{11})"',s); print("contentIds",ids[:12])
          for vid in ids[:8]:
            i=s.find('"contentId":"'+vid); seg=s[i:i+6000]
            t=re.search(r'"title":\{"content":"([^"]+)"',seg); 
            st=re.findall(r'"(LIVE|UPCOMING|Scheduled for[^"]*|Waiting[^"]*|watching[^"]*)"',seg)[:3]
            print(vid, t.group(1) if t else None, st)
          PY
          curl -sIL https://worldofsailors.com/sailor/robert-scheidt | grep -iE "^(x-frame|content-security|HTTP)"
