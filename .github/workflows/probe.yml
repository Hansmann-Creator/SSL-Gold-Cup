name: Probe tracking (temporary)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"; B=https://app.georacing.com
          for f in /protect_js/app/env.js /protect_js/app/main.js; do
            echo "=== $f"; curl -sL -A "$UA" -m 20 "$B$f?v=2" -o a.js; wc -c a.js
            grep -oE "['\"][^'\" ]*(https?:)?//[^'\" ]{4,120}['\"]" a.js | sort -u | head -40
            grep -oE "(ajax|getJSON|url)[^;]{0,160}" a.js | head -30
          done
          echo "=== events list guesses"
          for u in "$B/app/ajax.php?application_id=46" "$B/events?application_id=46" "https://api.georacing.com/applications/46" "https://player.georacing.com/datas/applications/app_46.json" "https://player.georacing.com/datas/applications/46.json"; do
            echo "--- $u"; curl -sL -A "$UA" -m 15 "$u" -w "\n[%{http_code} %{content_type}]\n" | head -c 800; echo
          done
