name: Temporary probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          python scripts/build_extras.py
          cat live.json; python -c "import json;t=json.load(open('tracking.json'));print({k:{g:list(v.items())[:2] for g,v in d.items()} for k,d in t.items()})"
          (python -m http.server 8000 >/dev/null 2>&1 &) ; sleep 2
          cat > s.py <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch();ctx=await b.new_context(viewport={"width":390,"height":844},device_scale_factor=2,is_mobile=True,has_touch=True)
              await ctx.add_init_script('localStorage.setItem("gcmb_onb","1")')
              pg=await ctx.new_page();await pg.goto("http://localhost:8000/index.html#home");await pg.wait_for_timeout(3000)
              n=await pg.evaluate("[...document.querySelectorAll('[data-trk]')].length");print("trk",n)
              if n:
                await pg.evaluate("document.querySelector('[data-trk]').click()");await pg.wait_for_timeout(15000)
                print("url after",pg.url);await pg.screenshot(path="trk.png")
                await pg.keyboard.press("Escape")
              await pg.goto("http://localhost:8000/index.html#home");await pg.wait_for_timeout(2000)
              await pg.evaluate("document.querySelector('[data-live]').click()");await pg.wait_for_timeout(8000);await pg.screenshot(path="live.png")
              await pg.keyboard.press("Escape");await pg.wait_for_timeout(500)
              await pg.evaluate("document.querySelector('.races li.rc').click()");await pg.wait_for_timeout(800)
              await pg.evaluate("document.querySelector('[data-wxo]')&&document.querySelector('[data-wxo]').click()");await pg.wait_for_timeout(6000)
              await pg.evaluate("document.querySelector('.windy')&&document.querySelector('.windy').scrollIntoView()");await pg.wait_for_timeout(6000);await pg.screenshot(path="wx.png")
          asyncio.run(main())
          PY
          python s.py
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: "*.png" }
