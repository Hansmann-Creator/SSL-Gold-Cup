name: Probe tracking (temporary)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"; D=https://player.georacing.com/datas
          curl -sL -A "$UA" "https://player.georacing.com/js/script.js?v=20261029123804" -o s.js
          grep -oE ".{220}general_ranking\.json.{160}" s.js | head -3
          echo; grep -oE ".{120}(URL_DATAS|url_datas|urlDatas)[^;]{0,120}" s.js | sort -u | head -20
          echo; grep -oE "\"[a-z_]+\.json\"" s.js | sort -u | head -40
          E=102234; R=103527
          for f in general_ranking.json $R/general_ranking.json $R/ranking.json $R/race.json $R/infos.json; do
            echo "--- $D/$E/$f"; curl -sL -A "$UA" -e "https://player.georacing.com/" -m 15 "$D/$E/$f" -w "\n[%{http_code}]\n" | head -c 900; echo; done
