name: Temporary probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sIL https://shop.sslgoldcup.com/ | grep -iE "^(HTTP|location)"
          curl -sL -A "Mozilla/5.0" https://shop.sslgoldcup.com/ > s.html; wc -c s.html
          grep -oE '<title>[^<]*' s.html; grep -oE 'woocommerce-loop-product__title">[^<]*' s.html | head -20; grep -oE 'product-category/[a-z0-9/-]+' s.html | sort -u | head -20
          grep -ioE '(coming soon|closed|maintenance|out of stock)[^<]{0,60}' s.html | head -5
          curl -sL -A "Mozilla/5.0" "https://shop.sslgoldcup.com/wp-json/wc/store/v1/products?per_page=30" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(p['name'],'|',p['prices']['price'],p['prices']['currency_code'],'|',p['is_in_stock'],'|',p['permalink']) for p in d]" 2>&1 | head -40
