name: Live results (every minute)

# Race days. The window comes from scripts/plan.py (same schedule as the app, incl. sched.json):
#   loop starts 60 min before the first race (livestream, tracking, reminders),
#   results are polled from ~15 min before the first race can finish (learned race length, timing.json),
#   loop ends 2 h after the last race could finish (later if races are delayed).
# GitHub's schedule is often late, so a run is attempted every 20 min; runs queue (no cancelling),
# a run outside the window exits at once, and a queued run takes over when the 6-hour job limit is reached.
on:
  schedule:
    - cron: "*/20 0-2,11-23 * 11,12 *"
  push:
    branches: [main]
    paths: [".github/live_kick"]   # commit this file to (re)start the loop when GitHub's schedule is late
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run (minutes)"
        default: "5"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Race day in Rio / inside the live window?
        id: day
        run: |
          W=$(python3 scripts/plan.py window); NOW=$(date +%s); RD=false
          if [ "$W" != "none" ]; then read S E F <<< "$W"; RD=true
            [ "$NOW" -gt "$E" ] && RD=false                      # window over
            [ "$NOW" -lt $((S - 50 * 60)) ] && RD=false          # too early: a later run starts the loop
          fi
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && RD=true
          echo "run=$RD" >> $GITHUB_OUTPUT; echo "Rio $(TZ=America/Sao_Paulo date '+%F %H:%M') window=$W run=$RD"
      - uses: actions/setup-python@v5
        if: steps.day.outputs.run == 'true'
        with: { python-version: "3.12" }
      - name: Check every minute
        if: steps.day.outputs.run == 'true'
        run: |
          pip install -q beautifulsoup4 python-docx
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          START=$(date +%s)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then END=$((START + ${{ inputs.minutes || 5 }} * 60)); else
            END=$((START + 345 * 60)); fi
          DISP=${{ github.event_name == 'workflow_dispatch' }}
          while [ "$(date +%s)" -lt "$END" ]; do
            git pull -q --rebase origin main || { git rebase --abort; git reset -q --hard origin/main; }
            if [ "$DISP" != "true" ]; then
              W=$(python3 scripts/plan.py window); [ "$W" = "none" ] && { echo "no races today"; break; }
              read WS WE WF <<< "$W"
              [ "$(date +%s)" -ge "$WE" ] && { echo "live window over"; break; }
              if [ "$(date +%s)" -lt "$WS" ]; then sleep $((60 - $(date +%s) % 60)); continue; fi
            fi
            # live video of the SSL channel, every 2 minutes
            if [ $(( $(date +%s) / 60 % 2 )) -eq 0 ]; then
              timeout 30 python scripts/live_video.py || true
              PUSH_STATE=/tmp/push_state.json timeout 60 python scripts/push_extra.py live || true
              if ! git diff --quiet live.json; then git add live.json; git commit -qm "live video $(date -u +%H:%M)" && { git push -q origin main && gh workflow run deploy.yml --ref main || git reset -q --hard origin/main; }; fi
            fi
            # tracking: rebuild the site's race mirror when Georacing sets up course/boats/finishes (every 3 min)
            if [ $(( $(date +%s) / 60 % 3 )) -eq 1 ]; then
              if timeout 60 python scripts/trk_watch.py | grep -q '^changed'; then gh workflow run deploy.yml --ref main || true; fi
            fi
            # race timing learned from Georacing (actual starts/finishes, operator start times), every 2 min
            if [ $(( $(date +%s) / 60 % 2 )) -eq 1 ] || [ "$(timeout 10 python scripts/hot.py)" = "hot" ]; then
              if timeout 90 python scripts/timing.py | grep -q '^changed'; then git add timing.json; git commit -qm "timing $(date -u +%H:%M)" && { git push -q origin main && gh workflow run deploy.yml --ref main || git reset -q --hard origin/main; }; fi
            fi
            # race ticker (mark roundings, lead changes, finish, Georacing race stats → tk/*.json), every 2 min, every minute while a race finishes
            if [ $(( $(date +%s) / 60 % 2 )) -eq 0 ] || [ "$(timeout 10 python scripts/hot.py)" = "hot" ]; then
              if timeout 90 python scripts/ticker.py | tee /tmp/tk.txt | grep -q '^changed'; then git add tk; git commit -qm "ticker $(date -u +%H:%M)" && { git push -q origin main && gh workflow run deploy.yml --ref main || git reset -q --hard origin/main; }; fi
              cat /tmp/tk.txt
            fi
            # race reports from the Google Drive folder 02_Race-Reports, every 5 min
            if [ $(( $(date +%s) / 60 % 5 )) -eq 2 ]; then
              if timeout 120 python scripts/reports.py | tee /tmp/rep.txt | grep -q '^changed'; then git add reports.json; git commit -qm "race report $(date -u +%H:%M)" && { git push -q origin main && gh workflow run deploy.yml --ref main || git reset -q --hard origin/main; }; fi
              cat /tmp/rep.txt
            fi
            # start reminders (15 min before a race, opt-in)
            PUSH_STATE=/tmp/push_state.json timeout 60 python scripts/push_extra.py remind || true
            sleep $((60 - $(date +%s) % 60))
          done

  # Results run as their own job, so slow steps of the live loop (tracking, reports, timing) never delay them.
  # Every minute once the first race can be over; every 10 s while a race is about to finish / has finished
  # and its official result is not online yet (scripts/hot.py, from Georacing start/finish in timing.json).
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Race day in Rio / inside the live window?
        id: day
        run: |
          W=$(python3 scripts/plan.py window); NOW=$(date +%s); RD=false
          if [ "$W" != "none" ]; then read S E F <<< "$W"; RD=true
            [ "$NOW" -gt "$E" ] && RD=false
            [ "$NOW" -lt $((S - 50 * 60)) ] && RD=false
          fi
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && RD=true
          echo "run=$RD" >> $GITHUB_OUTPUT; echo "window=$W run=$RD"
      - uses: actions/setup-python@v5
        if: steps.day.outputs.run == 'true'
        with: { python-version: "3.12" }
      - name: Results
        if: steps.day.outputs.run == 'true'
        run: |
          pip install -q beautifulsoup4
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          START=$(date +%s)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then END=$((START + ${{ inputs.minutes || 5 }} * 60)); else
            END=$((START + 345 * 60)); fi
          DISP=${{ github.event_name == 'workflow_dispatch' }}
          LAST=0; FAILSINCE=0; ALERT=""; PULL=0
          tomin() { sleep $((60 - $(date +%s) % 60)); }
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ $(( $(date +%s) - PULL )) -ge 30 ]; then   # timing.json/flags.json from the live job
              git pull -q --rebase origin main || { git rebase --abort; git reset -q --hard origin/main; }; PULL=$(date +%s); fi
            if [ "$DISP" != "true" ]; then
              W=$(python3 scripts/plan.py window); [ "$W" = "none" ] && { echo "no races today"; break; }
              read WS WE WF <<< "$W"
              [ "$(date +%s)" -ge "$WE" ] && { echo "live window over"; break; }
              [ "$(python3 scripts/plan.py results)" = "on" ] || { tomin; continue; }
            fi
            HOT=$(timeout 10 python scripts/hot.py)
            NOW=$(date +%s); STAMP=""; [ $((NOW - LAST)) -ge 600 ] && STAMP="--stamp"
            cp results.json /tmp/old.json
            if timeout 40 python scripts/update_results.py $STAMP; then
              if ! git diff --quiet results.json; then
                git add results.json; git commit -qm "results $(date -u +%FT%TZ)$([ "$HOT" = hot ] && echo " (hot)")"
                if git push -q origin main || { git pull -q --rebase origin main && git push -q origin main; }; then
                  gh workflow run deploy.yml --ref main; LAST=$NOW; PULL=$(date +%s)
                  timeout 60 python scripts/notify.py /tmp/old.json results.json || true
                else git rebase --abort 2>/dev/null; git reset -q --hard origin/main; fi
              fi
              FAILSINCE=0
              if [ -n "$ALERT" ]; then gh issue close "$ALERT" -c "Results are updating again ($(date -u +%H:%M) UTC)." || true; ALERT=""; fi
            else echo "check failed $(date -u +%H:%M:%S)"; git checkout -q results.json 2>/dev/null || true
              [ "$FAILSINCE" = 0 ] && FAILSINCE=$NOW
              if [ $((NOW - FAILSINCE)) -ge 600 ] && [ -z "$ALERT" ]; then
                ALERT=$(gh issue create -t "⚠ Gold Cup app: results not updating" -b "@Hansmann-Creator The official results page could not be read for 10 minutes in a row (since about $(TZ=America/Sao_Paulo date -d @$FAILSINCE +%H:%M) Rio time). The app keeps showing the last good results and tells users that results may be delayed. This issue closes itself as soon as reading works again." | grep -oE '[0-9]+$' || true)
              fi
            fi
            if [ "$HOT" = "hot" ]; then sleep 10; else tomin; fi
          done
