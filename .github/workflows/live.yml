name: Live results (every minute)

# Race days, 11:00-19:00 Rio time (UTC-3) = 14:00-22:00 UTC.
# A job may run at most 6 h, so two jobs cover the day; the second replaces the first.
on:
  schedule:
    - cron: "0 14 * 11,12 *"
    - cron: "40 19 * 11,12 *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run (minutes)"
        default: "5"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Race day in Rio?
        id: day
        run: |
          D=$(TZ=America/Sao_Paulo date +%F)
          case "$D" in 2026-11-2[6-9]|2026-12-0[2-5]|2026-12-0[7-9]|2026-12-10|2026-12-1[23]) RD=true;; *) RD=false;; esac
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && RD=true
          echo "run=$RD" >> $GITHUB_OUTPUT; echo "Rio $D race-day=$RD"
      - uses: actions/setup-python@v5
        if: steps.day.outputs.run == 'true'
        with: { python-version: "3.12" }
      - name: Check every minute
        if: steps.day.outputs.run == 'true'
        run: |
          pip install -q beautifulsoup4
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          START=$(date +%s)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then END=$((START + ${{ inputs.minutes || 5 }} * 60)); else
            END=$((START + 345 * 60)); STOP=$(date -u -d "today 22:00" +%s); [ $END -gt $STOP ] && END=$STOP; fi
          LAST=0; FAIL=0; ALERT=""
          while [ "$(date +%s)" -lt "$END" ]; do
            git pull -q --rebase origin main || { git rebase --abort; git reset -q --hard origin/main; }
            NOW=$(date +%s); STAMP=""; [ $((NOW - LAST)) -ge 600 ] && STAMP="--stamp"
            # live video of the SSL channel, every 2 minutes
            if [ $(( $(date +%s) / 60 % 2 )) -eq 0 ]; then
              timeout 30 python scripts/live_video.py || true
              PUSH_STATE=/tmp/push_state.json timeout 60 python scripts/push_extra.py live || true
              if ! git diff --quiet live.json; then git add live.json; git commit -qm "live video $(date -u +%H:%M)" && { git push -q origin main && gh workflow run deploy.yml --ref main || git reset -q --hard origin/main; }; fi
            fi
            # tracking: rebuild the site's race mirror when Georacing sets up course/boats/finishes (every 3 min)
            if [ $(( $(date +%s) / 60 % 3 )) -eq 1 ]; then
              if timeout 60 python scripts/trk_watch.py | grep -q '^changed'; then gh workflow run deploy.yml --ref main || true; fi
            fi
            # start reminders (15 min before a race, opt-in)
            PUSH_STATE=/tmp/push_state.json timeout 60 python scripts/push_extra.py remind || true
            cp results.json /tmp/old.json
            if timeout 50 python scripts/update_results.py $STAMP; then
              if ! git diff --quiet results.json; then
                git add results.json; git commit -qm "results $(date -u +%FT%TZ)"
                if git push -q origin main; then gh workflow run deploy.yml --ref main && LAST=$NOW; timeout 60 python scripts/notify.py /tmp/old.json results.json || true; else git reset -q --hard origin/main; fi
              fi
              FAIL=0
              if [ -n "$ALERT" ]; then gh issue close "$ALERT" -c "Results are updating again ($(date -u +%H:%M) UTC)." || true; ALERT=""; fi
            else echo "check failed, retrying next minute"; git checkout -q results.json 2>/dev/null; FAIL=$((FAIL+1))
              if [ "$FAIL" -eq 10 ] && [ -z "$ALERT" ]; then
                ALERT=$(gh issue create -t "⚠ Gold Cup app: results not updating" -b "@Hansmann-Creator The official results page could not be read for 10 minutes in a row (since about $(TZ=America/Sao_Paulo date -d '-10 min' +%H:%M) Rio time). The app keeps showing the last good results and tells users that results may be delayed. This issue closes itself as soon as reading works again." | grep -oE '[0-9]+$' || true)
              fi
            fi
            sleep $((60 - $(date +%s) % 60))
          done
