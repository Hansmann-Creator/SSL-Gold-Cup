name: Backup check (every 10 minutes)

# Safety net: runs only when the minute-by-minute job is not running.
on:
  schedule:
    - cron: "*/10 0-2,13-23 * 11,12 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Should run?
        id: day
        run: |
          D=$(TZ=America/Sao_Paulo date +%F); H=$(TZ=America/Sao_Paulo date +%H)
          W=$(python3 scripts/plan.py window); RD=false
          if [ "$W" != "none" ]; then read S E F <<< "$W"; [ "$(date +%s)" -le "$E" ] && [ "$(python3 scripts/plan.py results)" = "on" ] && RD=true; fi
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && RD=true
          LIVE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow live.yml --status in_progress --json databaseId -q length)
          [ "$LIVE" != "0" ] && RD=false && echo "live job running – nothing to do"
          echo "run=$RD" >> $GITHUB_OUTPUT; echo "Rio $D $H:xx run=$RD"
      - uses: actions/setup-python@v5
        if: steps.day.outputs.run == 'true'
        with: { python-version: "3.12" }
      - name: Check and publish
        if: steps.day.outputs.run == 'true'
        run: |
          pip install -q beautifulsoup4
          cp results.json /tmp/old.json
          python scripts/update_results.py --stamp
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          git add results.json
          if ! git diff --cached --quiet; then git commit -qm "results $(date -u +%FT%TZ)" && git push -q origin main && gh workflow run deploy.yml --ref main && { timeout 60 python scripts/notify.py /tmp/old.json results.json || true; }; fi
