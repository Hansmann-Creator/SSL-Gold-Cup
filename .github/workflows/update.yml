name: Update results and deploy

on:
  schedule:
    # every 10 minutes, 11:00-18:50 Rio time (UTC-3) = 14:00-21:50 UTC; race-day check below
    - cron: "*/10 14-21 * 11,12 *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Race day in Rio?
        id: day
        run: |
          D=$(TZ=America/Sao_Paulo date +%F); H=$(TZ=America/Sao_Paulo date +%H)
          case "$D" in 2026-11-2[6-9]|2026-12-0[2-5]|2026-12-0[7-9]|2026-12-1[0-3]) RD=true;; *) RD=false;; esac
          [ "$D" = "2026-12-11" ] && RD=false
          if [ "$RD" = true ] && [ "$H" -ge 11 ] && [ "$H" -lt 19 ]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; fi
          echo "Rio $D $H:xx race-day=$RD"
      - uses: actions/setup-python@v5
        if: steps.day.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        with: { python-version: "3.12" }
      - name: Fetch official results
        id: res
        if: steps.day.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -q beautifulsoup4
          python scripts/update_results.py
      - name: Commit
        if: steps.day.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "results $(date -u +%FT%TZ)" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
