name: Sailor facts from open sources (Wikidata, Wikipedia, Olympedia)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N sailors (0 = all)"
        default: "0"
  schedule:
    - cron: "37 7 * * 1"   # Mondays 04:37 Rio
permissions:
  contents: write
  actions: write
concurrency: { group: ext, cancel-in-progress: false }
jobs:
  e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ext_sources.py ${{ inputs.limit || '0' }} | tee /tmp/ext.log
      - run: |
          git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
          git add ext.json
          if ! git diff --cached --quiet; then git commit -qm "sailor facts from open sources"; git pull -q --rebase origin main; git push -q origin main; fi
