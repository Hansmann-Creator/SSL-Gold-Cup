name: probe sp
on: { push: { branches: [main], paths: [.github/workflows/probe_sp.yml] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out && python3 - <<'PY'
          import sys,json;sys.path.insert(0,'scripts')
          import sailors as S
          for sl in ["stefano-peschiera","robert-scheidt","zsombor-berecz","allan-julie"]:
              r=S.profile(sl)
              if r: json.dump(r[1],open(f"out/{sl}.json","w"),ensure_ascii=False)
          PY
          cd out && git init -q && git checkout -q -b probe-sp && git add . && git -c user.name=bot -c user.email=bot@x commit -qm sp
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-sp
