name: Highlight video push (every 30 minutes)

on:
  schedule:
    - cron: "7,37 * * 11,12 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extras
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: New highlight video? Notify followers who switched it on
        run: |
          timeout 90 python3 scripts/push_extra.py video || true
          if [ -f push_state.json ] && ! git diff --quiet -- push_state.json 2>/dev/null || [ -n "$(git status --porcelain push_state.json)" ]; then
            git config user.name "results-bot"; git config user.email "results-bot@users.noreply.github.com"
            git add push_state.json && git commit -qm "push state" && { git push -q origin main || { git pull -q --rebase origin main && git push -q origin main; }; } || true
          fi
