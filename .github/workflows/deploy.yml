name: Deploy app

on:
  push:
    branches: [main]
    paths-ignore: ["push_state.json"]
  workflow_dispatch:
  schedule:
    - cron: "41 * * 11,12 *"   # hourly refresh of videos and tracking links during the event

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Code changes are tested before they go live. Result-only updates (dispatched by the
  # results jobs) skip the test so new results are online as fast as possible.
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1
      - run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          python scripts/build_extras.py
          python scripts/smoke.py
  build:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calendars and tracking links
        run: python3 scripts/build_extras.py
      - name: App version (changes only when app files change, not with results)
        run: echo "{\"v\":\"$(cat index.html config.js app.js app.css sw.js manifest.webmanifest teaminfo.json people.json roster.json | sha256sum | cut -c1-12)\"}" > version.json && cat version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
